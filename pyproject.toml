[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-match"
version = "0.1.0"
description = "Find duplicate audio and same-session recordings in a large WAV library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.21"]

[project.scripts]
audio-match = "audiomatch.cli:main"

[tool.setuptools.packages.find]
include = ["audiomatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
